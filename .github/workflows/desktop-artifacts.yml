# GitHub Actions workflow to package DeepSeek Harness Desktop artifacts
# Generates Linux AppImage and Windows EXE installers.

name: Desktop Artifacts (AppImage & Windows EXE)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  DSH_DESKTOP_APP_ID: 'com.deepseek.harness'
  DOWNLOAD_TEST_ORIGIN: 'https://desktop-updates.example.com'

jobs:
  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          clean: true

      - name: Configure runner-private caches
        run: |
          echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"
          echo "npm_config_devdir=${{ runner.temp }}/node-gyp" >> "$GITHUB_ENV"
          echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Linux AppImage
        run: pnpm run package:desktop:linux:x64

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-linux-appimage
          path: apps/desktop/.desktop-build/targets/linux-x64/artifacts/*.AppImage
          if-no-files-found: error
          retention-days: 14

  build-windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          clean: true

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Windows EXE (Unsigned)
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-windows-exe
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error
          retention-days: 14
